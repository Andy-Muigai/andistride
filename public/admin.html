<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders — Andistride admin</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
.admin-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:24px 8px}
.admin-head h1{margin:0;font-size:30px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font:800 24px Lexend,sans-serif}
.stat span{font-size:13px;color:var(--muted)}
.orders{display:flex;flex-direction:column;gap:14px;padding-bottom:60px}
.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.order-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.order-top b{font:700 18px Lexend,sans-serif}
.st{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.5px}
.st-AWAITING_CONFIRMATION{background:#EDE7FB;color:#4B2C8F}
.st-UNAVAILABLE{background:#EEF1F4;color:#4A5563}
.st-AWAITING_PAYMENT,.st-PENDING{background:#FFF1E0;color:#8A4B00}
.st-PAID{background:#E3F4E8;color:#1D6B36}
.st-DISPATCHED{background:#E3EFFB;color:#164F7D}
.st-DELIVERED{background:#E6E9F7;color:#33407A}
.st-CANCELLED,.st-FAILED,.st-AMOUNT_MISMATCH{background:#FBE7E5;color:#A3261B}
.meta{font-size:14px;line-height:1.7;color:#2E4A60}
.meta strong{color:var(--navy)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{padding:11px 16px;font-size:14px}
details{font-size:14px;background:var(--bg);border-radius:12px;padding:10px 12px}
details summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
.login{max-width:380px;margin:70px auto;display:flex;flex-direction:column;gap:14px}
.search{flex:1 1 220px}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img src="/images/logo.jpg" alt="Andifusion logo"><span><b>ANDISTRIDE</b><small>ORDERS</small></span></a>
    <nav class="nav"><button class="btn btn-outline" id="refresh" type="button" hidden>Refresh</button><button class="btn btn-outline" id="logout" type="button" hidden>Log out</button></nav>
  </div>
</header>

<main class="wrap">
  <form class="login panel" id="login">
    <h1 style="margin:0;font-size:26px">Orders</h1>
    <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px">Admin password
      <input id="pw" type="password" autocomplete="current-password" required>
    </label>
    <p class="error" id="loginErr" hidden></p>
    <button class="btn btn-primary" type="submit">Open orders</button>
  </form>

  <section id="app" hidden>
    <div class="admin-head">
      <h1>Orders</h1>
      <input class="search" id="search" type="search" placeholder="Search name, phone, order no." aria-label="Search orders">
    </div>
    <div class="stats" id="stats"></div>
    <div class="filters" role="group" aria-label="Filter by status" id="filters" style="margin-bottom:16px"></div>
    <div class="orders" id="orders"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString('en-KE');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const LABEL = { AWAITING_CONFIRMATION: 'To confirm', UNAVAILABLE: 'Not available', AWAITING_PAYMENT: 'Awaiting payment', PENDING: 'Prompt sent', PAID: 'Paid', DISPATCHED: 'Dispatched', DELIVERED: 'Delivered', CANCELLED: 'Cancelled', FAILED: 'Payment failed', AMOUNT_MISMATCH: 'Amount mismatch' };
const FILTERS = [['ALL', 'All'], ['AWAITING_CONFIRMATION', 'To confirm'], ['UNPAID', 'Awaiting payment'], ['PAID', 'Paid – to dispatch'], ['DISPATCHED', 'Dispatched'], ['DELIVERED', 'Delivered'], ['CANCELLED', 'Cancelled'], ['UNAVAILABLE', 'Not available']];
let token = '';
try { token = localStorage.getItem('andistrideAdmin') || ''; } catch (e) {}
let orders = [], filter = 'ALL', q = '';

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-token': token, ...(opts.headers || {}) } });
  if (r.status === 401) { logout(); throw new Error('Wrong password'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Request failed');
  return r.json();
}
async function loadOrders() {
  orders = await api('/api/admin/orders');
  $('login').hidden = true; $('app').hidden = false; $('refresh').hidden = false; $('logout').hidden = false;
  render();
}
function logout() {
  token = ''; try { localStorage.removeItem('andistrideAdmin'); } catch (e) {}
  $('login').hidden = false; $('app').hidden = true; $('refresh').hidden = true; $('logout').hidden = true;
}
$('login').addEventListener('submit', async (e) => {
  e.preventDefault(); $('loginErr').hidden = true;
  token = $('pw').value.trim();
  try { await loadOrders(); try { localStorage.setItem('andistrideAdmin', token); } catch (e) {} }
  catch (err) { $('loginErr').textContent = 'Wrong password — copy ADMIN_TOKEN from Render again.'; $('loginErr').hidden = false; }
});
$('logout').onclick = logout;
$('refresh').onclick = () => loadOrders().catch(() => {});
$('search').oninput = (e) => { q = e.target.value.toLowerCase(); render(); };
$('filters').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; render(); } };

function matches(o) {
  if (filter === 'UNPAID' && !['AWAITING_PAYMENT', 'PENDING', 'FAILED', 'AMOUNT_MISMATCH'].includes(o.status)) return false;
  if (!['ALL', 'UNPAID'].includes(filter) && o.status !== filter) return false;
  if (!q) return true;
  return [o.orderNo, o.customer.name, o.customer.phone, o.customer.town, o.mpesaReceipt].join(' ').toLowerCase().includes(q);
}
function render() {
  const paid = orders.filter((o) => ['PAID', 'DISPATCHED', 'DELIVERED'].includes(o.status));
  $('stats').innerHTML = [
    [orders.filter((o) => o.status === 'AWAITING_CONFIRMATION').length, 'To confirm'],
    [orders.filter((o) => ['AWAITING_PAYMENT', 'PENDING'].includes(o.status)).length, 'Awaiting payment'],
    [orders.filter((o) => o.status === 'PAID').length, 'To dispatch'],
    [paid.length, 'Paid orders'],
    ['KSh ' + fmt(paid.reduce((s, o) => s + o.total, 0)), 'Paid sales'],
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('filters').innerHTML = FILTERS.map(([f, l]) => `<button type="button" class="chip" data-f="${f}" aria-pressed="${f === filter}">${l}</button>`).join('');
  const list = orders.filter(matches);
  $('orders').innerHTML = list.length ? list.map(card).join('') : '<p style="color:var(--muted)">No orders here yet.</p>';
}
function card(o) {
  const c = o.customer, i = o.item, when = new Date(o.createdAt).toLocaleString('en-KE', { dateStyle: 'medium', timeStyle: 'short' });
  const phone = '0' + String(c.phone).slice(3);
  const wa = `https://wa.me/${c.phone}?text=${encodeURIComponent(`Hi ${c.name}, this is Andistride about order ${o.orderNo}. `)}`;
  const btn = (status, label, cls = 'btn-outline') => `<button type="button" class="btn ${cls}" data-act="${status}" data-no="${o.orderNo}">${label}</button>`;
  let acts = '';
  if (o.status === 'AWAITING_CONFIRMATION') acts += btn('AWAITING_PAYMENT', 'Confirm – in stock', 'btn-primary') + btn('UNAVAILABLE', 'Not available');
  if (['AWAITING_PAYMENT', 'PENDING', 'FAILED', 'AMOUNT_MISMATCH'].includes(o.status)) acts += btn('PAID', 'Mark paid', 'btn-primary') + btn('CANCELLED', 'Cancel');
  const pickup = o.delivery && o.delivery.method === 'pickup';
  if (o.status === 'PAID') acts += btn('DISPATCHED', pickup ? 'Ready to collect' : 'Mark dispatched', 'btn-primary') + btn('ETIMS', o.etimsNo ? 'Edit eTIMS no.' : 'Add eTIMS no.');
  if (o.status === 'DISPATCHED') acts += btn('DELIVERED', pickup ? 'Mark collected' : 'Mark delivered', 'btn-primary') + btn('ETIMS', o.etimsNo ? 'Edit eTIMS no.' : 'Add eTIMS no.');
  if (['CANCELLED', 'UNAVAILABLE'].includes(o.status)) acts += btn('AWAITING_CONFIRMATION', 'Reopen');
  acts += `<a class="btn btn-outline" href="${wa}">WhatsApp</a><a class="btn btn-outline" href="tel:+${c.phone}">Call</a>`;
  const rows = o.etims.lines.map((l) => `<tr><td>${esc(l.item)}</td><td class="n">${l.qty}</td><td class="n">${fmt(l.net)}</td><td class="n">${fmt(l.vat)}</td><td class="n">${fmt(l.gross)}</td></tr>`).join('');
  return `<article class="order">
    <div class="order-top"><b>${esc(o.orderNo)}</b><span class="st st-${esc(o.status)}">${esc(LABEL[o.status] || o.status)}</span></div>
    <div class="meta">
      <div><strong>${esc(i.name)}</strong> (${esc(i.code)}) · size ${i.size} · qty ${i.qty}</div>
      ${o.toy ? `<div>+ Toy: <strong>${esc(o.toy.name)}</strong> · KSh ${fmt(o.toy.price)} (${o.toy.discountPercent}% bundle)</div>` : ''}
      <div>${esc(c.name)} · ${esc(phone)}</div>
      <div>Deliver to <strong>${esc(c.town)}</strong> by <strong>${esc(o.delivery ? o.delivery.name : 'Matatu parcel')}</strong>${c.stage ? ' · ' + esc(c.stage) : ''}</div>
      <div>Total <strong>KSh ${fmt(o.total)}</strong> (incl. delivery KSh ${fmt(o.deliveryFee)}) · ${esc(when)}</div>
      ${o.mpesaReceipt ? `<div>M-Pesa code: <strong>${esc(o.mpesaReceipt)}</strong></div>` : ''}
      ${o.note ? `<div>Note: ${esc(o.note)}</div>` : ''}
      ${o.etimsNo ? `<div>eTIMS invoice: <strong>${esc(o.etimsNo)}</strong></div>` : ''}
    </div>
    <div class="actions">${acts}</div>
    <details><summary>eTIMS figures</summary>
      <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Net</th><th class="n">VAT 16%</th><th class="n">Total</th></tr></thead><tbody>${rows}</tbody></table>
    </details>
  </article>`;
}
$('orders').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const no = b.dataset.no, act = b.dataset.act, o = orders.find((x) => x.orderNo === no);
  const body = { status: act === 'ETIMS' ? o.status : act };
  if (act === 'PAID') {
    const code = prompt(`M-Pesa code for ${no} (KSh ${fmt(o.total)}):`, o.mpesaReceipt || '');
    if (code === null) return; body.mpesaCode = code.trim();
  }
  if (act === 'ETIMS') {
    const n = prompt(`eTIMS invoice number for ${no}:`, o.etimsNo || '');
    if (n === null) return; body.etimsNo = n.trim();
  }
  if (act === 'CANCELLED' && !confirm(`Cancel order ${no}?`)) return;
  if (act === 'UNAVAILABLE' || act === 'DISPATCHED') {
    const n = prompt(act === 'UNAVAILABLE'
      ? `Message for the customer (e.g. "Size ${o.item.size} is out of stock — size ${o.item.size + 1} is available"):`
      : (o.delivery && o.delivery.method === 'pickup' ? 'Note for the customer (optional, e.g. opening hours):' : 'Parcel details (sacco/courier, waybill or receipt no., expected arrival):'), '');
    if (n === null) return; body.note = n.trim();
  }
  b.disabled = true;
  try {
    const updated = await api(`/api/admin/orders/${encodeURIComponent(no)}/status`, { method: 'POST', body: JSON.stringify(body) });
    orders = orders.map((x) => (x.orderNo === no ? updated : x)); render();
    const link = `${location.origin}/order?no=${encodeURIComponent(no)}&k=${encodeURIComponent(updated.key || '')}`;
    const msgs = {
      AWAITING_PAYMENT: `Hi ${updated.customer.name}, your Andistride order ${no} (${updated.item.name}, size ${updated.item.size}) is confirmed in stock. Total KSh ${fmt(updated.total)}. Pay here: ${link}`,
      UNAVAILABLE: `Hi ${updated.customer.name}, sorry — your Andistride order ${no} (${updated.item.name}, size ${updated.item.size}) isn't available. ${updated.note || ''} Details: ${link}`,
      DISPATCHED: updated.delivery && updated.delivery.method === 'pickup'
        ? `Hi ${updated.customer.name}, your Andistride order ${no} is ready to collect at our shop. ${updated.note || ''} Directions: ${link}`
        : `Hi ${updated.customer.name}, your Andistride order ${no} has been dispatched to ${updated.customer.town}. ${updated.note || ''} Track: ${link}`,
    };
    if (msgs[act] && confirm('Open WhatsApp to message the customer?')) {
      location.href = `https://wa.me/${updated.customer.phone}?text=${encodeURIComponent(msgs[act])}`;
    }
  } catch (err) { alert(err.message); b.disabled = false; }
});

if (token) loadOrders().catch(() => {});
</script>
</body>
</html>
